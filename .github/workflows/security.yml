name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy repository scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan the repository
        # Pinned to the v0.36.0 commit: a scanner that silently changes what it
        # reports is worse than one that is a version behind.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # The toolchain comes from the go directive in server/go.mod, so that
      # line is the security floor for the standard library as well as the
      # language version: a stdlib advisory is fixed by raising it.
      # govulncheck itself is deliberately unpinned — a vulnerability scanner
      # a year behind is worse than one that changes under you.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd server && govulncheck ./...

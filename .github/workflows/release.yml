name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (YYYY.M.PATCH). Blank = auto-compute."
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/web/package-lock.json

      - name: Resolve version
        id: version
        # The dispatch input goes through the environment rather than being
        # interpolated into the script, and is checked against the version
        # scheme before it is used as a tag.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$'; then
              echo "::error::version must look like YYYY.M.PATCH"
              exit 1
            fi
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(./scripts/next-version.sh)" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: cd server && go test ./...

      - name: Build the web UI
        run: ./scripts/web.sh

      - name: Build all targets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build.sh

      - name: Create and push the tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Create the GitHub release
        # Pinned to the v2.0.8 commit; a release step is not the place for a
        # floating tag.
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: dist/*
          generate_release_notes: true

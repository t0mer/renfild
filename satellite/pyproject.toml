# Tooling configuration only — runtime dependencies are pinned in
# requirements.txt (that is what install.sh feeds to pip).

[project]
name = "renfild-satellite"
version = "0.0.0"
description = "Wake-word satellite for the Renfild voice assistant"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["satellite*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
